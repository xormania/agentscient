{
  "name": "ci",
  "on": {
    "pull_request": {
      "types": [
        "opened",
        "synchronize",
        "reopened"
      ],
      "branches": [
        "dev"
      ]
    },
    "merge_group": {
      "branches": [
        "dev"
      ]
    },
    "push": {
      "branches": [
        "dev"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": "${{ github.event_name == 'pull_request' }}"
  },
  "jobs": {
    "lane": {
      "runs-on": "self-hosted",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "the host's user toolchain on PATH (~/.local/bin)",
          "run": "echo \"$HOME/.local/bin\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "records branches by local name — the probe corpus reads them so (offline; the checkout holds them as remote-tracking refs)",
          "run": "git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/records/ | while read -r b; do git branch -f \"$b\" \"origin/$b\"; done"
        },
        {
          "name": "the complete dev-lane gate",
          "env": {
            "TERM_WALL": "${{ vars.TERM_WALL }}"
          },
          "run": "bash ops/bin/suites.sh"
        }
      ]
    },
    "app": {
      "runs-on": "self-hosted",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "the host's user toolchain on PATH (~/.local/bin)",
          "run": "echo \"$HOME/.local/bin\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "the host toolchain the self-hosted runner relies on",
          "run": "php --version | head -1 && composer --version && python3 --version && cue version | head -1 && jq --version && ruff --version"
        },
        {
          "name": "composer validate — the manifest and the lock agree",
          "run": "composer validate --strict"
        },
        {
          "name": "composer install — from the lock, nothing resolved on the runner",
          "run": "composer install --prefer-dist --no-progress --no-interaction"
        },
        {
          "name": "php lint",
          "run": "find src packages -name '*.php' -print0 | xargs -0 -r -n50 php -l"
        },
        {
          "name": "the kernel boots",
          "run": "php bin/console about"
        },
        {
          "name": "phpunit — the project and every package",
          "run": "vendor/bin/phpunit"
        },
        {
          "name": "mate serves measured truth — the compiled container answers",
          "run": "vendor/bin/mate tools:call symfony-services --query=router --limit=10 --format=json \\\n  | jq -e '.untrusted_data.services[\"router.default\"]'\nvendor/bin/mate tools:list\n"
        }
      ]
    }
  }
}
