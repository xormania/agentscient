{
  "name": "ci",
  "on": {
    "pull_request": {
      "types": [
        "opened",
        "synchronize",
        "reopened"
      ],
      "branches": [
        "dev"
      ]
    },
    "merge_group": {
      "branches": [
        "dev"
      ]
    },
    "push": {
      "branches": [
        "dev"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": "${{ github.event_name == 'pull_request' }}"
  },
  "jobs": {
    "lane": {
      "runs-on": "self-hosted",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "records branches by local name \u2014 the probe corpus reads them so (offline; the checkout holds them as remote-tracking refs)",
          "run": "git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/records/ | while read -r b; do git branch -f \"$b\" \"origin/$b\"; done"
        },
        {
          "name": "Verify inputs, reuse proven checks, execute the remainder",
          "id": "verify",
          "env": {
            "TERM_WALL": "${{ vars.TERM_WALL }}",
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -m ops.devlane.workflow.checks.ci lane"
        },
        {
          "name": "Preserve executed verification evidence",
          "if": "${{ always() && steps.verify.outputs.receipt != '' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "${{ steps.verify.outputs.artifact }}",
            "path": "${{ steps.verify.outputs.receipt }}",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    },
    "app": {
      "runs-on": "self-hosted",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Verify inputs, reuse proven checks, execute the remainder",
          "id": "verify",
          "env": {
            "TERM_WALL": "${{ vars.TERM_WALL }}",
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -m ops.devlane.workflow.checks.ci app"
        },
        {
          "name": "Preserve executed verification evidence",
          "if": "${{ always() && steps.verify.outputs.receipt != '' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "${{ steps.verify.outputs.artifact }}",
            "path": "${{ steps.verify.outputs.receipt }}",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
