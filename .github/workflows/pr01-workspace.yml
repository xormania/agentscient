name: temporary PR-01 candidate transport
on:
  push:
    branches: [lane/session-20260924-pr01-cheap-reads]
    paths: [.github/workflows/pr01-workspace.yml, '.dev/pr01-publish-*.b64']
permissions:
  contents: write
jobs:
  candidate:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Obtain declared tool paths without changing operator configuration
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify and apply the locally tested patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, os, subprocess
          from pathlib import Path
          data = ''.join(Path(f'.dev/pr01-publish-{i}.b64').read_text() for i in range(3))
          patch = gzip.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '89d6124aee62d52921a075c8ed950e64f04d76ab17e86c5ac2a7b0ecb065eb38'
          path = Path(os.environ['RUNNER_TEMP']) / 'pr01-tested.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          # Correct only the recorded command's filename, not source behavior.
          report = Path('ops/conductor/reports/pr01-cheap-reads.md')
          report.write_text(report.read_text().replace('`test_onboard.py -k TheLockLine`', '`test_onboard_lever.py -k TheLockLine`'))
          subprocess.run(['git', 'add', str(report)], check=True)
          subprocess.run(['git', 'rm', '--', *[f'.dev/pr01-publish-{i}.b64' for i in range(3)]], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Lint and inspect native auditor availability without reading credentials
        run: |
          mkdir -p "$RUNNER_TEMP/pr01-validation"
          {
            command -v codex || true
            timeout 20 codex --version 2>&1 || true
            if test -f "${CODEX_HOME:-$HOME/.codex}/auth.json"; then echo 'codex auth file: present (contents not read)'; else echo 'codex auth file: absent'; fi
          } > "$RUNNER_TEMP/pr01-validation/auditor-availability.txt"
          ruff --version > "$RUNNER_TEMP/pr01-validation/ruff-version.txt"
          cp "$(command -v ruff)" "$RUNNER_TEMP/pr01-validation/ruff"
          ruff check --no-cache . > "$RUNNER_TEMP/pr01-validation/ruff.log" 2>&1
      - name: Publish only to this session branch, without force or stored credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          branch = 'lane/session-20260924-pr01-cheap-reads'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          message = 'fix(lane): make observations read-only and record explicit measurements\n\nOwner-authorized PR-01 dev-lane hand work; one producer, independent second producer absent. Local red/green, faults and latency are recorded in ops/conductor/reports/pr01-cheap-reads.md. Native CI and security audit are separate readiness requirements.\n\nSource: owner 2026-09-24 UTC, PR-01 cheap reads and shared readiness specifications\nCo-Authored-By: GPT-6 Astra Pro <noreply@openai.com>'
          subprocess.run(['git', '-c', 'user.name=GPT-6 Astra Pro', '-c', 'user.email=noreply@openai.com', 'commit', '-m', message], check=True)
          token = os.environ['GH_TOKEN']
          env = dict(os.environ)
          env['GIT_CONFIG_COUNT'] = '1'
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode()
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], env=env, check=True)
          with open(os.environ['RUNNER_TEMP'] + '/pr01-validation/published-head.txt', 'w') as out:
              subprocess.run(['git', 'rev-parse', 'HEAD'], stdout=out, check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr01-candidate-validation
          path: ${{ runner.temp }}/pr01-validation/
          retention-days: 1
          if-no-files-found: warn
