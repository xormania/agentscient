{
  "name": "application checks (manual, legacy)",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "app": {
      "runs-on": "${{ fromJSON(vars.CI_RUNNER_MODE == 'local' && '\"self-hosted\"' || (vars.CI_RUNNER_MODE == '' || vars.CI_RUNNER_MODE == 'hosted') && '\"ubuntu-24.04\"' || 'INVALID_CI_RUNNER_MODE_expected_hosted_or_local') }}",
      "timeout-minutes": 4,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Prepare hosted Python",
          "if": "${{ runner.environment == 'github-hosted' }}",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Prepare hosted PHP and Composer",
          "if": "${{ runner.environment == 'github-hosted' }}",
          "uses": "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240",
          "with": {
            "php-version": "8.4",
            "extensions": "ctype, dom, iconv, mbstring, xml, xmlwriter, sqlite3, pdo_sqlite",
            "tools": "composer:v2",
            "coverage": "none"
          }
        },
        {
          "name": "Verify inputs, reuse proven checks, execute the remainder",
          "id": "verify",
          "env": {
            "TERM_WALL": "${{ vars.TERM_WALL }}",
            "GITHUB_TOKEN": "${{ github.token }}",
            "CI_RUNNER_MODE": "${{ vars.CI_RUNNER_MODE || 'hosted' }}",
            "CI_RUNNER_ENVIRONMENT": "${{ runner.environment }}"
          },
          "run": "python3 -m ops.devlane.workflow.checks.ci app"
        },
        {
          "name": "Optional Symfony fixture integration (outside dev CI)",
          "run": "PYTHONPATH=ops/devlane/fixtures/tests python3 -m unittest test_symfony_app_app.SymfonyAppMakeProve.test_full_proof_after_composer_install"
        },
        {
          "name": "Preserve executed verification evidence",
          "if": "${{ always() && steps.verify.outputs.receipt != '' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "${{ steps.verify.outputs.artifact }}",
            "path": "${{ steps.verify.outputs.receipt }}",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
