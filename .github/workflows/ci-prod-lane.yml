{
  "name": "prod-lane",
  "on": {
    "workflow_call": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "php": {
      "runs-on": "${{ fromJSON(vars.CI_RUNNER_MODE == 'local' && '\"self-hosted\"' || (vars.CI_RUNNER_MODE == '' || vars.CI_RUNNER_MODE == 'hosted') && '\"ubuntu-24.04\"' || 'INVALID_CI_RUNNER_MODE_expected_hosted_or_local') }}",
      "timeout-minutes": 10,
      "env": {
        "APP_ENV": "test",
        "APP_DEBUG": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Prepare hosted PHP and Composer",
          "if": "${{ runner.environment == 'github-hosted' }}",
          "uses": "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240",
          "with": {
            "php-version": "8.4",
            "extensions": "ctype, dom, iconv, mbstring, xml, xmlwriter, sqlite3, pdo_sqlite",
            "tools": "composer:v2",
            "coverage": "none"
          }
        },
        {
          "name": "Prepare temporary Composer when absent",
          "run": "if command -v composer >/dev/null; then exit 0; fi\nci_tools=$(mktemp -d \"$RUNNER_TEMP/prod-composer.XXXXXX\")\ncurl --fail --silent --show-error https://getcomposer.org/installer -o \"$ci_tools/installer.php\"\nexpected=$(curl --fail --silent --show-error https://composer.github.io/installer.sig)\nactual=$(php -r 'echo hash_file(\"sha384\", $argv[1]);' \"$ci_tools/installer.php\")\n[[ \"$expected\" == \"$actual\" ]]\nphp \"$ci_tools/installer.php\" --2 --quiet --install-dir=\"$ci_tools\" --filename=composer\nprintf '%s\\n' \"$ci_tools\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "Record revision and tool versions",
          "run": "mkdir -p var/ci\ngit rev-parse HEAD | tee var/ci/revision.txt\nprintf 'Tested revision: `%s`\\n' \"$(cat var/ci/revision.txt)\" >> \"$GITHUB_STEP_SUMMARY\"\nphp --version\ncomposer --version"
        },
        {
          "name": "Validate Composer metadata",
          "run": "composer validate --strict"
        },
        {
          "name": "Install locked dependencies",
          "run": "composer install --prefer-dist --no-progress --no-interaction\ncomposer check-platform-reqs"
        },
        {
          "name": "Lint application PHP",
          "run": "find src config packages tests public bin mate -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l\nphp -l bin/console"
        },
        {
          "name": "Check Symfony configuration and container",
          "run": "php bin/console lint:yaml config --parse-tags\nphp bin/console lint:container\nphp bin/console about"
        },
        {
          "name": "Run PHPUnit",
          "run": "vendor/bin/phpunit --log-junit var/ci/phpunit.xml"
        },
        {
          "name": "Upload revision and PHPUnit results",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "prod-lane-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "var/ci/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
