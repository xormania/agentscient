{
  "name": "Retain CI toolchain",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "work-order/php-toolchain-job-retain"
      ],
      "paths": [
        ".github/workflows/retain-toolchain.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "retain-ci-toolchain",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "runs-on": "${{ fromJSON(vars.CI_RUNNER_MODE == 'local' && '\"self-hosted\"' || (vars.CI_RUNNER_MODE == '' || vars.CI_RUNNER_MODE == 'hosted') && '\"ubuntu-24.04\"' || 'INVALID_CI_RUNNER_MODE_expected_hosted_or_local') }}",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Recover approved PHP from sibling runner caches (bootstrap only)",
          "run": "python3 - <<'PYRECOVER'\nimport hashlib, json, os, shutil\nfrom pathlib import Path\nconfig = json.loads(Path('.github/actions/php-runtime/toolchain.json').read_text())\ndigest = config['php']['sha256']\ntarget = Path(os.environ['RUNNER_TOOL_CACHE']) / 'agentscient-php' / (digest + '.tar.gz')\nroot = Path(os.environ['RUNNER_TEMP']).parents[2]\nfor candidate in root.glob('*/_work/_tool/agentscient-php/' + digest + '.tar.gz'):\n    with candidate.open('rb') as source:\n        valid = hashlib.file_digest(source, 'sha256').hexdigest() == digest\n    if valid:\n        target.parent.mkdir(parents=True, exist_ok=True)\n        if candidate.resolve() != target.resolve():\n            shutil.copyfile(candidate, target)\n        print('Recovered approved archive:', candidate)\n        break\nelse:\n    raise SystemExit('Approved archive absent from sibling runner tool caches')\nPYRECOVER"
        },
        {
          "name": "Retain checksum-verified executables",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 .github/actions/php-runtime/toolchain.py publish"
        },
        {
          "name": "Install from release with an empty cache",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "export RUNNER_TOOL_CACHE=\"$(mktemp -d \"$RUNNER_TEMP/toolchain-cold.XXXXXX\")\"\npython3 .github/actions/php-runtime/toolchain.py install"
        },
        {
          "name": "Verify selected executables",
          "run": "php --version\ncomposer --version\nphp -r 'foreach ([\"ctype\",\"dom\",\"iconv\",\"mbstring\",\"xml\",\"xmlwriter\",\"sqlite3\",\"pdo_sqlite\"] as $ext) { if (!extension_loaded($ext)) { fwrite(STDERR, \"Missing: $ext\\n\"); exit(1); } }'"
        }
      ]
    }
  }
}
